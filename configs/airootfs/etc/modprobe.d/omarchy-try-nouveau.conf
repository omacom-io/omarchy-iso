# Keep nouveau from binding NVIDIA GPUs in the live environment.
#
# "Try Omarchy" runs the live desktop software-rendered on the firmware
# framebuffer (simpledrm) whenever the session has no in-tree GPU driver for the
# panel — the NVIDIA case, since the try session deliberately ships no NVIDIA
# driver. If nouveau were allowed to bind, it would claim the card and evict
# simpledrm, yet cannot modeset newer GPUs (e.g. Blackwell), leaving no usable
# display at all. Blacklisting it keeps simpledrm on the panel so the software
# fallback always has something to render to. The installer sets up the real
# proprietary driver on disk regardless, so nothing here affects an install.
blacklist nouveau
