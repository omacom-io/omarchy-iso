# Load partition table and file system modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

# Use graphics-mode output
insmod font
if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    set gfxmode="auto"
    terminal_input console
    terminal_output gfxterm
fi

# Enable serial console
insmod serial
insmod usbserial_common
insmod usbserial_ftdi
insmod usbserial_pl2303
insmod usbserial_usbdebug
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

# Get a human readable platform identifier
if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
    if [ "${grub_cpu}" == 'x86_64' ]; then
        archiso_platform="x64 ${archiso_platform}"
    elif [ "${grub_cpu}" == 'i386' ]; then
        archiso_platform="IA32 ${archiso_platform}"
    else
        archiso_platform="${grub_cpu} ${archiso_platform}"
    fi
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu} ${grub_platform}"
fi

# Set default menu entry: the TTY installer greeter on the stock linux kernel
# (broadest generic-PC hardware support; the same kernel the "Try Omarchy"
# Ctrl+T session runs on). The menu stays visible so the user can instead pick
# the full SDDM live desktop, the T2/Mac kernel, or a nomodeset GPU fallback
# before the timeout auto-boots into the installer.
set default=omarchy-install
set timeout=15
set timeout_style=menu

# Menu entries
#
# Order is load-bearing for the headless acceptance harness: grub highlights the
# default (omarchy-install, index 0) and the harness presses Return to boot it,
# so it must sit at index 0.

menuentry "Omarchy - Install (TTY wizard) (%ARCH%, ${archiso_platform})" --class arch --class gnu-linux --class gnu --class os --id 'omarchy-install' {
    set gfxpayload=keep
    # modprobe.blacklist=nouveau: this greeter's "Try Omarchy" (Ctrl+T) renders
    # the live desktop on the firmware framebuffer (simpledrm) when the session
    # has no in-tree driver for the panel, which is the NVIDIA case. nouveau
    # would claim the card and evict simpledrm, yet cannot modeset newer GPUs
    # (Blackwell and up), leaving no usable display at all. It is set here rather
    # than in /etc/modprobe.d so it applies to UEFI boots only: those are the
    # ones with a firmware framebuffer to fall back to. A BIOS boot has none, so
    # it keeps nouveau and its console. Nothing here reaches the installed
    # system, which sets up the real driver.
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% modprobe.blacklist=nouveau quiet splash xe.enable_panel_replay=0 initramfs_async=0 omarchy.install
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Omarchy - Try the desktop (%ARCH%, ${archiso_platform})" --class arch --class gnu-linux --class gnu --class os --id 'omarchy-live' {
    set gfxpayload=keep
    # The live desktop boots the same stock linux kernel as the installer. With
    # no driver prebaked into its initramfs (NVIDIA is set up on demand in a Try
    # session), nouveau must stay off the card so the desktop can fall back to
    # the firmware framebuffer instead of dead-looping on a GPU it cannot drive.
    # UEFI-only, where that fallback exists; see the omarchy-install entry.
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% modprobe.blacklist=nouveau quiet splash xe.enable_panel_replay=0 initramfs_async=0 omarchy.live
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Omarchy - Try the desktop (linux-t2, Mac) (%ARCH%, ${archiso_platform})" --class arch --class gnu-linux --class gnu --class os --id 'omarchy-live-t2' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-t2 archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash xe.enable_panel_replay=0 initramfs_async=0 omarchy.live
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-t2.img
}

menuentry "Omarchy - Try the desktop (nomodeset) (%ARCH%, ${archiso_platform})" --class arch --class gnu-linux --class gnu --class os --id 'omarchy-live-nomodeset' {
    set gfxpayload=keep
    # blacklist keeps nouveau off the NVIDIA card under nomodeset too, so the
    # desktop preview still gets a firmware framebuffer to render on.
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% modprobe.blacklist=nouveau quiet splash xe.enable_panel_replay=0 initramfs_async=0 nomodeset omarchy.live
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Omarchy with speakup screen reader (%ARCH%, ${archiso_platform})" --hotkey s --class arch --class gnu-linux --class gnu --class os --id 'archlinux-accessibility' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-t2 archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% modprobe.blacklist=nouveau accessibility=on xe.enable_panel_replay=0 initramfs_async=0 omarchy.install
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-t2.img
}


if [ "${grub_platform}" == 'efi' -a "${grub_cpu}" == 'x86_64' -a -f '/boot/memtest86+/memtest.efi' ]; then
    menuentry 'Run Memtest86+ (RAM test)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest.efi
    }
fi
if [ "${grub_platform}" == 'pc' -a -f '/boot/memtest86+/memtest' ]; then
    menuentry 'Run Memtest86+ (RAM test)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest
    }
fi
if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == 'x86_64' -a -f '/shellx64.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellx64.efi
        }
    elif [ "${grub_cpu}" == "i386" -a -f '/shellia32.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellia32.efi
        }
    fi

    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'System shutdown' --class shutdown --class poweroff {
    echo 'System shutting down...'
    halt
}

menuentry 'System restart' --class reboot --class restart {
    echo 'System rebooting...'
    reboot
}


